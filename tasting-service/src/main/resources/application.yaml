spring:
  application:
    name: tasting-service

  # Connection to the Postgres container from docker-compose.yml
  datasource:
    url: jdbc:postgresql://localhost:5432/tasting
    username: pourplate
    password: pourplate   # local dev only, later this comes from env variables / Kubernetes Secrets

  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate only CHECKS that entities match the tables,
      # it never creates or changes tables itself.
      ddl-auto: validate
    # Turns off a Spring default that keeps DB connections open during the whole web request.
    open-in-view: false

  flyway:
    enabled: true          # runs scripts in src/main/resources/db/migration on startup

  # login sessions are stored in postgres, so a restart doesnt log anyone out
  session:
    jdbc:
      # flyway creates the tables in V10, spring should not try to do it itself
      initialize-schema: never

server:
  port: 8081               # 8080 is kept free for the API gateway later
  servlet:
    session:
      # stay logged in for two weeks, even if you close the browser
      timeout: 14d
      cookie:
        http-only: true    # javascript in the page can never read the session cookie
        same-site: lax     # the browser does not send it with requests from other websites
        max-age: 14d       # the browser keeps the cookie for two weeks

# Actuator: exposes /actuator/health so Docker/Kubernetes can check the app is alive
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  admin:
    username: svent
    password: ${ADMIN_PASSWORD:}
  # where the website runs, used to build invite links
  frontend-url: http://localhost:5173