# says that envoy gateway is the program that runs our gateways
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
# the entrance door, it listens on port 80
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: pour-and-plate-gateway
  namespace: {{ .Release.Namespace }}          # <<< changed
spec:
  gatewayClassName: envoy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
---
# sends every request that comes in the door to the frontend service
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontend
  namespace: {{ .Release.Namespace }}          # <<< changed
spec:
  parentRefs:
    - name: pour-and-plate-gateway
  rules:
    - backendRefs:
        - name: frontend
          port: 80